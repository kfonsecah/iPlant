<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>iPlant Chat – Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e8e8e8; height: 100dvh; display: flex; flex-direction: column; }
    #header { padding: 14px 20px; background: #1a1d27; border-bottom: 1px solid #2a2d3a; display: flex; align-items: center; gap: 10px; }
    #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; flex-shrink: 0; }
    #status-dot.online { background: #4ade80; }
    #header h1 { font-size: 16px; font-weight: 500; color: #fff; }
    #sub { font-size: 11px; color: #6b7280; margin-left: auto; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .bubble-wrap { display: flex; gap: 8px; align-items: flex-end; max-width: 75%; }
    .bubble-wrap.own { align-self: flex-end; flex-direction: row-reverse; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; border: 1.5px solid; }
    .bubble { padding: 9px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; max-width: 100%; word-break: break-word; }
    .bubble-wrap.own .bubble { background: rgba(74,222,128,.15); border: 1px solid rgba(74,222,128,.25); color: #d1fae5; border-top-right-radius: 4px; }
    .bubble-wrap.other .bubble { background: #1e2130; border: 1px solid #2a2d3a; color: #e8e8e8; border-top-left-radius: 4px; }
    .name { font-size: 10px; font-weight: 600; margin-bottom: 3px; }
    .time { font-size: 10px; color: #4b5563; margin-top: 3px; }
    #input-area { padding: 12px 16px 20px; background: #1a1d27; border-top: 1px solid #2a2d3a; display: flex; gap: 8px; }
    #msg-input { flex: 1; background: #0f1117; border: 1px solid #2a2d3a; border-radius: 20px; padding: 10px 16px; color: #e8e8e8; font-size: 14px; outline: none; }
    #msg-input:focus { border-color: #4ade80; }
    #send-btn { background: #4ade80; color: #0f2a1a; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #send-btn:disabled { background: #1e2130; color: #4b5563; cursor: not-allowed; }
    #join-screen { position: fixed; inset: 0; background: #0f1117; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    #join-screen h2 { font-size: 20px; font-weight: 300; }
    #join-screen p { font-size: 13px; color: #6b7280; }
    #nick-input { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 12px; padding: 12px 18px; color: #e8e8e8; font-size: 15px; width: 260px; outline: none; text-align: center; }
    #nick-input:focus { border-color: #4ade80; }
    #join-btn { background: #4ade80; color: #0f2a1a; border: none; border-radius: 12px; padding: 12px 32px; font-size: 15px; font-weight: 600; cursor: pointer; width: 260px; }
    #join-btn:hover { background: #86efac; }
    #typing { padding: 4px 16px 0; font-size: 11px; color: #6b7280; min-height: 18px; }
  </style>
</head>
<body>

<div id="join-screen">
  <h2>iPlant Community Chat</h2>
  <p>Tester desde el navegador</p>
  <input id="nick-input" placeholder="Tu apodo (ej: ProfeTest)" maxlength="20" />
  <button id="join-btn" onclick="join()">Entrar al chat</button>
</div>

<div id="header">
  <div id="status-dot"></div>
  <h1>Comunidad</h1>
  <span id="sub">Desconectado</span>
</div>
<div id="messages"></div>
<div id="typing"></div>
<div id="input-area">
  <input id="msg-input" placeholder="Escribe un mensaje..." maxlength="1000" disabled />
  <button id="send-btn" disabled onclick="sendMsg()">↑</button>
</div>

<script>
  const API = 'https://chat-backend-4nzg.onrender.com';
  const WS  = 'wss://chat-backend-4nzg.onrender.com';

  let ws, myId, myNickname, token;
  const COLORS = ['#4ade80','#60a5fa','#f472b6','#fb923c','#a78bfa','#34d399','#facc15'];

  function colorFromId(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) & 0xffff;
    return COLORS[h % COLORS.length];
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  async function join() {
    const nick = document.getElementById('nick-input').value.trim() || 'Tester';
    const res = await fetch(`${API}/api/chat/join`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname: nick }),
    });
    const data = await res.json();
    token = data.token;
    myId = data.user.id;
    myNickname = data.user.nickname;
    document.getElementById('join-screen').style.display = 'none';
    connectWS();
  }

  function connectWS() {
    ws = new WebSocket(`${WS}/ws/${token}`);
    ws.onopen  = () => setStatus(true);
    ws.onclose = () => { setStatus(false); setTimeout(connectWS, 4000); };
    ws.onerror = () => setStatus(false);
    ws.onmessage = e => handle(JSON.parse(e.data));
  }

  function setStatus(on) {
    document.getElementById('status-dot').className = on ? 'online' : '';
    document.getElementById('sub').textContent = on ? 'Conectado' : 'Desconectado';
    document.getElementById('msg-input').disabled = !on;
    document.getElementById('send-btn').disabled = !on;
  }

  let typingTimers = {};
  function handle(d) {
    switch (d.type) {
      case 'group_history':
        d.messages.forEach(addMsg);
        break;
      case 'group_message':
        addMsg(d.message);
        break;
      case 'typing':
        clearTimeout(typingTimers[d.user_id]);
        document.getElementById('typing').textContent = `${d.nickname} está escribiendo...`;
        typingTimers[d.user_id] = setTimeout(() => {
          document.getElementById('typing').textContent = '';
        }, 3000);
        break;
      case 'stop_typing':
        clearTimeout(typingTimers[d.user_id]);
        document.getElementById('typing').textContent = '';
        break;
    }
  }

  function addMsg(msg) {
    const own = msg.sender_id === myId;
    const color = colorFromId(msg.sender_id);
    const initials = msg.sender_nickname.slice(0,2).toUpperCase();

    const wrap = document.createElement('div');
    wrap.className = `bubble-wrap ${own ? 'own' : 'other'}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.style.backgroundColor = color + '22';
    avatar.style.borderColor = color + '55';
    avatar.style.color = color;
    avatar.textContent = initials;

    const col = document.createElement('div');
    if (!own) {
      const name = document.createElement('div');
      name.className = 'name';
      name.style.color = color;
      name.textContent = msg.sender_nickname;
      col.appendChild(name);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.content || '';

    if (msg.media?.url) {
      const img = document.createElement('img');
      img.src = msg.media.url;
      img.style.cssText = 'max-width:200px;border-radius:10px;display:block;margin-bottom:6px;';
      bubble.prepend(img);
    }

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = fmtTime(msg.timestamp);

    col.appendChild(bubble);
    col.appendChild(time);
    wrap.appendChild(avatar);
    wrap.appendChild(col);

    const msgs = document.getElementById('messages');
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
  }

  let typingOut;
  document.getElementById('msg-input').addEventListener('input', () => {
    if (ws?.readyState === 1) {
      ws.send(JSON.stringify({ type: 'typing' }));
      clearTimeout(typingOut);
      typingOut = setTimeout(() => ws.send(JSON.stringify({ type: 'stop_typing' })), 2500);
    }
  });

  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });

  function sendMsg() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || ws?.readyState !== 1) return;
    ws.send(JSON.stringify({ type: 'group_message', content: text }));
    ws.send(JSON.stringify({ type: 'stop_typing' }));
    clearTimeout(typingOut);
    input.value = '';
  }
</script>
</body>
</html>
